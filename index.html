<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cards — слова как в инстаграме</title>
<meta name="description" content="До 1000 частотных существительных и глаголов английского, русского и тайского в карточках как в инстаграме: фото, транскрипция, перевод, озвучка.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="bg-zinc-950 font-sans text-zinc-100 antialiased">

<header class="sticky top-0 z-10 border-b border-zinc-800 bg-zinc-950/95 backdrop-blur">
  <div class="flex flex-wrap items-center gap-x-3 gap-y-2 px-3 py-2">
    <a href="./" class="flex items-center gap-2 text-lg font-bold tracking-tight">
      <svg class="size-7 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
      Cards
    </a>
    <div class="flex items-center gap-1.5">
      <div id="base" class="seg" role="group"></div>
      <svg class="size-4 shrink-0 text-zinc-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      <div id="target" class="seg" role="group"></div>
    </div>
    <div class="stats-wrap relative">
      <button id="stats" type="button" class="flex cursor-pointer items-center gap-1.5 whitespace-nowrap text-sm text-zinc-300" aria-expanded="false"></button>
      <div id="learned" class="pop" role="dialog"></div>
    </div>
    <div class="flex w-full flex-wrap items-center gap-2 sm:ml-auto sm:w-auto sm:flex-nowrap">
      <div id="pos" class="seg hidden sm:flex" role="group"></div>
      <select id="posSel" class="rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-sm font-semibold text-amber-400 outline-none focus:border-amber-400 sm:hidden"></select>
      <input id="q" type="search" class="min-w-[8rem] flex-1 rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-sm outline-none focus:border-amber-400 sm:w-44 sm:flex-none">
    </div>
  </div>
</header>

<main id="grid" class="mx-auto grid max-w-md items-start gap-3 py-3 sm:gap-4 sm:px-3 md:max-w-3xl md:grid-cols-2 lg:max-w-6xl lg:grid-cols-3"></main>
<p id="empty" class="hidden py-20 text-center text-zinc-500" role="status"></p>

<footer class="mt-4 space-y-2 border-t border-zinc-800 px-3 py-6 text-xs text-zinc-500">
  <p id="credits"></p>
  <p><button id="offBtn" type="button" class="cursor-pointer rounded-lg border border-zinc-700 px-3 py-1.5 text-zinc-300 hover:border-amber-400 hover:text-amber-400 disabled:cursor-not-allowed disabled:opacity-50" hidden></button></p>
  <p class="flex flex-wrap gap-x-3 gap-y-1">
    <span id="projects"></span>
    <a class="underline" href="https://thai.dateonymous.com" target="_blank" rel="noopener">ThaiFast</a>
    <a class="underline" href="https://eng.dateonymous.com" target="_blank" rel="noopener">EngFast</a>
    <a class="underline" href="https://sumer.dateonymous.com" target="_blank" rel="noopener">SumerFast</a>
    <a class="underline" href="https://brain.dateonymous.com" target="_blank" rel="noopener">BrainFast</a>
    <a class="underline" href="https://meditatio.dateonymous.com" target="_blank" rel="noopener">Meditat.io</a>
  </p>
</footer>

<script src="data.js"></script>
<script src="examples.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
